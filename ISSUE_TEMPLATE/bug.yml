name: Bug
description: Something doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, inputs (TIC IDs, sectors), browser, or a minimal example.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Commit or version
